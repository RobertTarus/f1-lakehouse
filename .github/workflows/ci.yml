name: F1 Lakehouse CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-lakehouse-ci-${{ github.ref }}
  cancel-in-progress: true


# ============================================================
# CI-ONLY ENVIRONMENT VARIABLES
#
# These are dummy values used only by GitHub Actions.
# They are NOT production credentials.
# ============================================================

env:
  AIRFLOW_UID: "50000"

  AIRFLOW_JWT_SECRET: "ci-only-jwt-secret"
  AIRFLOW_API_SECRET: "ci-only-api-secret"

  AWS_ACCESS_KEY_ID: "ci-access-key"
  AWS_SECRET_ACCESS_KEY: "ci-secret-key"

  SEAWEED_S3_BUCKET: "f1-raw"
  SEAWEED_TABLE_BUCKET: "f1-iceberg"

  TRINO_HOST: "localhost"
  TRINO_PORT: "8080"
  TRINO_USER: "ci"
  TRINO_CATALOG: "iceberg"
  TRINO_SCHEMA: "silver"


jobs:

  # ==========================================================
  # JOB 1
  # REPOSITORY VALIDATION
  # ==========================================================

  validate:

    name: Validate repository

    runs-on: ubuntu-24.04

    timeout-minutes: 10

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # --------------------------------------------------------
      # PYTHON
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # SHOW ENVIRONMENT
      # --------------------------------------------------------

      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Python:"
          python --version

          echo
          echo "Docker:"
          docker --version

          echo
          echo "Docker Compose:"
          docker compose version


      # --------------------------------------------------------
      # REQUIRED PROJECT FILES
      # --------------------------------------------------------

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "compose.yaml"

            "airflow/dags/f1_season_pipeline.py"

            "src/common/find_missing_races.py"
            "src/common/race_schedule.py"

            "src/ingestion/ingest_session.py"
            "src/ingestion/ingest_telemetry.py"

            "src/iceberg/promote_laps.py"
            "src/iceberg/promote_bronze.py"
            "src/iceberg/promote_all_telemetry.py"
            "src/iceberg/load_silver_telemetry.py"

            "dbt/dbt_project.yml"
            "configs/dbt/profiles.yml"

            "configs/trino/jvm.config"
            "configs/trino/config.properties"

            "tests/test_find_missing_races.py"
            "tests/test_race_schedule.py"
          )

          for file in "${required_files[@]}"
          do

            echo "Checking: $file"

            if [[ ! -f "$file" ]]
            then

              echo "::error file=$file::Required project file is missing."

              exit 1

            fi

          done

          echo
          echo "All required project files are present."


      # --------------------------------------------------------
      # SECRET HYGIENE
      # --------------------------------------------------------

      - name: Ensure .env is not committed
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch .env >/dev/null 2>&1
          then

            echo "::error::.env is tracked by Git."
            echo "Remove .env from the repository."

            exit 1

          fi

          echo ".env is not tracked."


      # --------------------------------------------------------
      # PYTHON SYNTAX
      # --------------------------------------------------------

      - name: Compile Python source
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q \
            src \
            airflow/dags \
            app \
            tests

          echo "Python syntax checks passed."


      # --------------------------------------------------------
      # AIRFLOW DAG SYNTAX
      # --------------------------------------------------------

      - name: Compile Airflow season DAG
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            airflow/dags/f1_season_pipeline.py

          echo "Airflow DAG syntax passed."


      # --------------------------------------------------------
      # COMPOSE VALIDATION
      # --------------------------------------------------------

      - name: Validate Compose configuration
        shell: bash
        run: |
          set -euo pipefail

          docker compose config --quiet

          echo "Compose configuration is valid."


      # --------------------------------------------------------
      # JOB SUMMARY
      # --------------------------------------------------------

      - name: Repository validation summary
        shell: bash
        run: |
          {
            echo "## ✅ Repository validation passed"
            echo
            echo "- Required files present"
            echo "- .env not tracked"
            echo "- Python syntax valid"
            echo "- Airflow DAG syntax valid"
            echo "- Compose configuration valid"
          } >> "$GITHUB_STEP_SUMMARY"



  # ==========================================================
  # JOB 2
  # DBT STATIC VALIDATION
  # ==========================================================

  dbt:

    name: Validate dbt project

    runs-on: ubuntu-24.04

    timeout-minutes: 15

    needs:
      - validate

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # --------------------------------------------------------
      # PYTHON
      #
      # This matches the Python version used by the project's
      # local dbt virtual environment.
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"


      # --------------------------------------------------------
      # INSTALL DBT
      # --------------------------------------------------------

      - name: Install dbt
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "dbt-core==1.12.4" \
            "dbt-trino==1.10.3"


      # --------------------------------------------------------
      # DBT VERSION
      # --------------------------------------------------------

      - name: Show dbt version
        shell: bash
        run: |
          set -euo pipefail

          dbt --version


      # --------------------------------------------------------
      # DBT PACKAGES
      # --------------------------------------------------------

      - name: Install dbt packages
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f dbt/packages.yml || -f dbt/dependencies.yml ]]
          then

            echo "dbt package file found."

            dbt deps \
              --project-dir dbt \
              --profiles-dir configs/dbt

          else

            echo "No packages.yml or dependencies.yml."
            echo "Skipping dbt deps."

          fi


      # --------------------------------------------------------
      # DBT PARSE
      #
      # This validates project structure, YAML, models,
      # sources, refs, Jinja, macros, and configuration.
      #
      # It does NOT require the Trino warehouse to be running.
      # --------------------------------------------------------

      - name: Parse dbt project
        shell: bash
        run: |
          set -euo pipefail

          dbt parse \
            --project-dir dbt \
            --profiles-dir configs/dbt \
            --no-partial-parse


      # --------------------------------------------------------
      # DBT RESOURCE DISCOVERY
      # --------------------------------------------------------

      - name: List dbt resources
        shell: bash
        run: |
          set -euo pipefail

          dbt ls \
            --project-dir dbt \
            --profiles-dir configs/dbt


      # --------------------------------------------------------
      # VERIFY REQUIRED MODELS
      # --------------------------------------------------------

      - name: Verify required dbt models
        shell: bash
        run: |
          set -euo pipefail

          dbt ls \
            --project-dir dbt \
            --profiles-dir configs/dbt \
            --resource-type model \
            --output name \
            > /tmp/dbt-models.txt

          echo "========================================"
          echo "DBT MODELS"
          echo "========================================"

          cat /tmp/dbt-models.txt

          echo
          echo "========================================"

          required_models=(
            "silver_laps"
            "silver_results"
            "silver_weather"
            "race_driver_performance"
            "lap_telemetry_metrics"
          )

          for model in "${required_models[@]}"
          do

            echo "Checking model: $model"

            if ! grep -Fxq "$model" /tmp/dbt-models.txt
            then

              echo "::error::Required dbt model '$model' was not found."

              exit 1

            fi

          done

          echo
          echo "All required dbt models were found."


      # --------------------------------------------------------
      # JOB SUMMARY
      # --------------------------------------------------------

      - name: dbt validation summary
        shell: bash
        run: |
          {
            echo "## ✅ dbt validation passed"
            echo
            echo "- dbt Core 1.12.4"
            echo "- dbt-trino 1.10.3"
            echo "- Project parsed successfully"
            echo "- Resource graph discovered"
            echo "- Required Silver and Gold models found"
          } >> "$GITHUB_STEP_SUMMARY"



  # ==========================================================
  # JOB 3
  # PYTHON UNIT TESTS
  # ==========================================================

  tests:

    name: Python unit tests

    runs-on: ubuntu-24.04

    timeout-minutes: 15

    needs:
      - validate

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # --------------------------------------------------------
      # PYTHON
      #
      # Airflow pipeline containers use Python 3.12.
      # Unit tests therefore run against Python 3.12.
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # INSTALL TEST DEPENDENCIES
      #
      # Only install what these unit tests require.
      #
      # We deliberately do NOT install Airflow, SeaweedFS,
      # Trino server, or dbt here.
      # --------------------------------------------------------

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "pytest==9.1.1" \
            "fastf1==3.8.3" \
            "pandas==2.3.3" \
            "trino" \
            "python-dotenv"


      # --------------------------------------------------------
      # SHOW TEST ENVIRONMENT
      # --------------------------------------------------------

      - name: Show test environment
        shell: bash
        run: |
          set -euo pipefail

          python --version

          python -m pytest --version


      # --------------------------------------------------------
      # RUN TESTS
      # --------------------------------------------------------

      - name: Run Python unit tests
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail

          python -m pytest \
            tests \
            -v


      # --------------------------------------------------------
      # JOB SUMMARY
      # --------------------------------------------------------

      - name: Unit test summary
        if: success()
        shell: bash
        run: |
          {
            echo "## ✅ Python unit tests passed"
            echo
            echo "- Race schedule logic"
            echo "- Event slug generation"
            echo "- Cold-start TABLE_NOT_FOUND handling"
            echo "- Cold-start SCHEMA_NOT_FOUND handling"
            echo "- Driver-set discovery"
            echo "- NULL driver protection"
            echo "- Unexpected Trino errors remain visible"
            echo
            echo "**Expected suite: 12 tests**"
          } >> "$GITHUB_STEP_SUMMARY"
