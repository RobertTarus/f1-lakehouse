x-airflow-common: &airflow-common

  build:
    context: .  
  dockerfile: docker/airflow/Dockerfile
  userns_mode: "keep-id"

  user: "${AIRFLOW_UID:-50000}:0"

  environment:
    AIRFLOW__CORE__HOSTNAME_CALLABLE: "socket.gethostname"
    AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: "8793"

    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg://airflow:airflow@airflow-postgres/airflow

    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__DAG_DISCOVERY_SAFE_MODE: "False"

    AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: >-
      http://airflow-api-server:8080/execution/

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"

    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET}

    HOME: /home/airflow
    PYTHONPATH: /home/airflow/.local/lib/python3.12/site-packages:/opt/airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"

    # SeaweedFS — container network addresses
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    SEAWEED_S3_ENDPOINT: http://seaweedfs:8333
    SEAWEED_S3_BUCKET: ${SEAWEED_S3_BUCKET}

    SEAWEED_TABLE_BUCKET: ${SEAWEED_TABLE_BUCKET}
    ICEBERG_CATALOG_URI: http://seaweedfs:8181

    # Trino — container network address
    TRINO_HOST: trino
    TRINO_PORT: "8080"

  volumes:
    - ./airflow/dags:/opt/airflow/dags:z
    - ./airflow/logs:/opt/airflow/logs:z

    - ./src:/opt/airflow/project/src:z
    - ./dbt:/opt/airflow/project/dbt:z
    - ./configs/dbt:/opt/airflow/project/configs/dbt:z
    - ./data/cache:/opt/airflow/project/data/cache:z
services:

  airflow-init:
    <<: *airflow-common

    container_name: f1-airflow-init

    depends_on:
      airflow-postgres:
        condition: service_healthy

    command: db migrate


  airflow-api-server:
    <<: *airflow-common

    container_name: f1-airflow-api-server

    depends_on:
      airflow-postgres:
        condition: service_healthy

    command: api-server

    ports:
      - "8082:8080"

    restart: unless-stopped


  airflow-scheduler:
    <<: *airflow-common

    container_name: f1-airflow-scheduler
    hostname: airflow-scheduler

    depends_on:
      airflow-postgres:
        condition: service_healthy

    command: scheduler

    restart: unless-stopped


  airflow-dag-processor:
    <<: *airflow-common

    container_name: f1-airflow-dag-processor

    depends_on:
      airflow-postgres:
        condition: service_healthy

    command: dag-processor

    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    container_name: f1-seaweedfs

    command:
      - mini
      - -dir=/data
      - -admin.port=12646

    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      # Normal S3 bucket
      S3_BUCKET: ${SEAWEED_S3_BUCKET}

      # Iceberg table bucket
      S3_TABLE_BUCKET: ${SEAWEED_TABLE_BUCKET}

    ports:
      - "8333:8333"     # S3 API
      - "8888:8888"     # Filer
      - "9333:9333"     # Master
      - "8181:8181"     # Iceberg REST Catalog
      - "23646:12646"   # Admin UI

    volumes:
      - ./data/seaweedfs:/data:Z

    restart: "no"

  trino:
    image: trinodb/trino:483
    container_name: f1-trino

    depends_on:
      - seaweedfs

    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    ports:
      - "8081:8080"

    volumes:
      - ./configs/trino/catalog:/etc/trino/catalog:Z

    restart: "no"

  airflow-postgres:
    image: postgres:16
    container_name: f1-airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U airflow
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  airflow-postgres-data:
