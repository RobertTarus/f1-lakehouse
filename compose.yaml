x-airflow-common: &airflow-common

  image: localhost/f1-airflow:3.3.1

  userns_mode: "keep-id"

  user: "${AIRFLOW_UID:-50000}:0"

  environment:

    # ========================================================
    # AIRFLOW
    # ========================================================

    AIRFLOW__CORE__HOSTNAME_CALLABLE: "socket.gethostname"
    AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: "8793"

    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg://airflow:airflow@airflow-postgres/airflow

    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__DAG_DISCOVERY_SAFE_MODE: "False"

    AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: >-
      http://airflow-api-server:8080/execution/

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"

    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET}

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"

    HOME: /home/airflow
    PYTHONPATH: /opt/airflow

    # ========================================================
    # SEAWEEDFS
    # ========================================================

    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    SEAWEED_S3_ENDPOINT: http://seaweedfs:8333
    SEAWEED_S3_BUCKET: ${SEAWEED_S3_BUCKET}

    SEAWEED_TABLE_BUCKET: ${SEAWEED_TABLE_BUCKET}

    ICEBERG_CATALOG_URI: http://seaweedfs:8181

    # ========================================================
    # TRINO
    # ========================================================

    TRINO_HOST: trino
    TRINO_PORT: "8080"

  volumes:

    # Airflow
    - ./airflow/dags:/opt/airflow/dags:z
    - ./airflow/logs:/opt/airflow/logs:z

    # Project
    - ./src:/opt/airflow/project/src:z
    - ./dbt:/opt/airflow/project/dbt:z
    - ./configs/dbt:/opt/airflow/project/configs/dbt:z

    # FastF1 cache
    - ./data/cache:/opt/airflow/project/data/cache:z


services:

  # ==========================================================
  # AIRFLOW INIT
  # ==========================================================

  airflow-init:

    <<: *airflow-common

    container_name: f1-airflow-init

    depends_on:

      airflow-postgres:
        condition: service_healthy

    command: db migrate


  # ==========================================================
  # AIRFLOW API SERVER
  # ==========================================================

  airflow-api-server:

    <<: *airflow-common

    container_name: f1-airflow-api-server

    depends_on:

      airflow-postgres:
        condition: service_healthy

    command: api-server

    ports:
      - "8082:8080"

    restart: unless-stopped


  # ==========================================================
  # AIRFLOW SCHEDULER
  # ==========================================================

  airflow-scheduler:

    <<: *airflow-common

    container_name: f1-airflow-scheduler

    hostname: airflow-scheduler

    depends_on:

      airflow-postgres:
        condition: service_healthy

    command: scheduler

    restart: unless-stopped


  # ==========================================================
  # AIRFLOW DAG PROCESSOR
  # ==========================================================

  airflow-dag-processor:

    <<: *airflow-common

    container_name: f1-airflow-dag-processor

    depends_on:

      airflow-postgres:
        condition: service_healthy

    command: dag-processor

    restart: unless-stopped


  # ==========================================================
  # SEAWEEDFS
  # ==========================================================

  seaweedfs:

    image: chrislusf/seaweedfs:4.46

    container_name: f1-seaweedfs

    command:
      - mini
      - -dir=/data
      - -admin.port=12646

    environment:

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      # Normal S3 / Raw bucket
      S3_BUCKET: ${SEAWEED_S3_BUCKET}

      # Iceberg table bucket
      S3_TABLE_BUCKET: ${SEAWEED_TABLE_BUCKET}

    ports:

      # S3 API
      - "8333:8333"

      # Filer
      - "8888:8888"

      # Master
      - "9333:9333"

      # Iceberg REST Catalog
      - "8181:8181"

      # SeaweedFS Admin UI
      - "23646:12646"

    volumes:

      - ./data/seaweedfs:/data:Z

    restart: unless-stopped


  # ==========================================================
  # TRINO
  # ==========================================================

  trino:

    image: trinodb/trino:483

    container_name: f1-trino

    depends_on:
      - seaweedfs

    environment:

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    ports:

      # Host 8081 -> Trino 8080
      - "8081:8080"

    # --------------------------------------------------------
    # MEMORY
    #
    # Host RAM: ~15 GiB
    #
    # Container maximum:
    #     6 GiB
    #
    # JVM maximum is configured separately in:
    #     configs/trino/jvm.config
    #
    # JVM:
    #     -Xms1G
    #     -Xmx4G
    # --------------------------------------------------------

    mem_limit: 6g

    volumes:

      # Iceberg catalog
      - ./configs/trino/catalog:/etc/trino/catalog:Z

      # Persistent JVM configuration
      - ./configs/trino/jvm.config:/etc/trino/jvm.config:ro,Z

      # Persistent Trino query-memory configuration
      - ./configs/trino/config.properties:/etc/trino/config.properties:ro,Z

    restart: unless-stopped


  # ==========================================================
  # AIRFLOW POSTGRES
  # ==========================================================

  airflow-postgres:

    image: postgres:16

    container_name: f1-airflow-postgres

    environment:

      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:

      - airflow-postgres-data:/var/lib/postgresql/data

    healthcheck:

      test:
        - CMD-SHELL
        - pg_isready -U airflow

      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


# ============================================================
# NAMED VOLUMES
# ============================================================

volumes:

  airflow-postgres-data:
